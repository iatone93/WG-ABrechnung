name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest -v
      - run: python -m pip install pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --onefile --windowed --name WG-Abrechnung wg_abrechnung.py
      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name WG-Abrechnung wg_abrechnung.py
          ditto -c -k --keepParent dist/WG-Abrechnung.app dist/WG-Abrechnung-mac.zip

      - name: Hochladen (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WG-Abrechnung-windows
          path: dist/WG-Abrechnung.exe
      - name: Hochladen (Mac)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: WG-Abrechnung-mac
          path: dist/WG-Abrechnung-mac.zip

  release:
    # Läuft nur, wenn ein Release / Tag wie v1.0.0 angelegt wurde
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
