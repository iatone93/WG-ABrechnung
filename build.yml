name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: WG-Abrechnung-windows
          - os: macos-latest
            artifact: WG-Abrechnung-mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --onefile --windowed --name WG-Abrechnung wg_abrechnung.py
      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name WG-Abrechnung wg_abrechnung.py
          ditto -c -k --keepParent dist/WG-Abrechnung.app dist/WG-Abrechnung-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/WG-Abrechnung.exe
            dist/WG-Abrechnung-mac.zip
